[package]
name = "transmission-remote-slint"
version = "0.7.0"
edition = "2021"

[[bin]]
name = "transmission-remote-slint"
path = "src/main.rs"

[dependencies]
slint        = { version = "1.7", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-winit-skia-opengl", "renderer-winit-skia-vulkan", "renderer-winit-software"] }
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
# TLS: rustls с провайдером ring (чистая сборка без cmake/perl; aws-lc-rs-дефолт reqwest 0.13 тянет aws-lc-sys)
reqwest      = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls       = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
toml         = "1"
libc         = "0.2"
anyhow       = "1"
base64       = "0.23"
# Трей через D-Bus StatusNotifierItem — без GTK, работает в KDE/GNOME/XFCE
# blocking feature = Handle + spawn без async runtime конфликтов со Slint
notify-rust  = { version = "4", default-features = false, features = ["d"] }
zbus         = ">=4, <5"
x11rb        = { version = "0.14", features = ["allow-unsafe-code"] }
image        = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build  = "1.7"
